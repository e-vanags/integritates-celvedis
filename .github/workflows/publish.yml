name: Publicēt vietni

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Izgūt repozitoriju
        uses: actions/checkout@v4

      - name: Uzstādīt Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Renderēt un publicēt GitHub Pages
        uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
